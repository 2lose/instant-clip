name = "instant-clip-feedback"
main = "src/worker.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# Per-IP limit on feedback posts.
[[ratelimits]]
name = "FEEDBACK_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 3
  period = 60

# Daily total across everyone (see DAILY_LIMIT in src/worker.js).
[[kv_namespaces]]
binding = "FEEDBACK_COUNTS"
id = "659db2e242e24211b0e99a1588867e0b"

# Secrets (never in this file): DISCORD_WEBHOOK, RELAY_KEY. See relay/README.md.
